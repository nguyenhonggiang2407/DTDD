spring.application.name=YangSlots
server.port=${PORT:3150}
server.address=${YANGSLOTS_BIND:127.0.0.1}
server.max-http-request-header-size=16KB
server.tomcat.threads.max=32
server.tomcat.accept-count=64
server.tomcat.connection-timeout=10s
server.tomcat.max-swallow-size=256KB
server.forward-headers-strategy=none
spring.datasource.url=${YANGSLOTS_DB:jdbc:h2:file:./data/yangslots;DB_CLOSE_ON_EXIT=FALSE;LOCK_TIMEOUT=5000;DATABASE_TO_UPPER=FALSE}
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=10000
spring.sql.init.mode=always
spring.web.resources.add-mappings=false
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false
spring.h2.console.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never
yangslots.allowed-hosts=${YANGSLOTS_ALLOWED_HOSTS:localhost,127.0.0.1}
yangslots.public-origin=${YANGSLOTS_PUBLIC_ORIGIN:}
yangslots.secure-cookie=${YANGSLOTS_SECURE_COOKIE:false}

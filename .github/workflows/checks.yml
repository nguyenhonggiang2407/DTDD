name: YangCareer checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - name: Install core dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q api main.py tests
      - name: Run API regression tests
        run: python -m unittest discover -s tests -v
      - name: Check browser JavaScript
        run: node --check frontend/app.js
      - name: Install browser test tools
        run: |
          npm install --package-lock=false --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Run browser tests
        run: npm run test:ui
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: interface-checks
          path: |
            docs/screenshots/
            test-results/
          retention-days: 14
      - name: Save verified screenshots
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/desktop.png docs/screenshots/mobile.png
          if ! git diff --cached --quiet; then
            git commit -m "Update interface screenshots [skip ci]"
            git push
          fi

name: YangSlots checks
on:
  push:
    branches: [main, yangslots]
    paths-ignore: ["docs/screenshots/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: chmod +x mvnw
      - run: npm ci
      - run: npm run format:check
      - run: ./mvnw -B verify
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - name: Build and verify runtime container
        run: |
          docker build -t yangslots:ci .
          trap 'docker rm -f yangslots-check >/dev/null 2>&1 || true' EXIT
          docker run -d --name yangslots-check --memory=512m -p 127.0.0.1:3151:3150 yangslots:ci
          for i in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:3151/health; then
              docker exec yangslots-check java -cp /probe vn.yang.slots.HealthProbe
              exit 0
            fi
            sleep 1
          done
          docker logs yangslots-check
          exit 1
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: yangslots-screenshots
          path: docs/screenshots/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: yangslots-application
          path: target/yangslots.jar
      - name: Save verified interface captures
        if: github.event_name == 'push' && github.ref == 'refs/heads/yangslots'
        run: |
          git add docs/screenshots
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: refresh verified reservation interface captures [skip ci]"
          git push

